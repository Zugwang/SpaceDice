# Rate limiting zone — shared across all server blocks
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # Redirect HTTP → HTTPS (certbot will manage this after setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    # SSL — managed by certbot (placeholders until first run)
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript font/woff2;
    gzip_min_length 256;

    # Static files — served directly by nginx, bypass gunicorn
    location /static/ {
        alias /opt/spacedice/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service Worker must be served from root scope
    location /sw.js {
        alias /opt/spacedice/static/sw.js;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # API — rate limited
    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://unix:/run/spacedice/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — no rate limit
    location /health {
        proxy_pass http://unix:/run/spacedice/gunicorn.sock;
        proxy_set_header Host $host;
        access_log off;
    }

    # App
    location / {
        proxy_pass http://unix:/run/spacedice/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
